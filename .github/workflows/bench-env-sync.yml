name: bench-env-sync
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the shared bench files with the sibling repo
        run: |
          for f in bench/bench-env.ps1 bench/tools/New-BenchReadme.ps1; do
            curl -fsSL -o sibling.tmp "https://raw.githubusercontent.com/vadyaravadim/cpu-parking-disabler/main/$f"
            cmp "$f" sibling.tmp || { echo "$f differs from cpu-parking-disabler main: copy the change to both repos"; exit 1; }
          done
