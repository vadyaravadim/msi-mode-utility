name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write        # create the release and upload assets
  id-token: write        # OIDC token for Sigstore signing (provenance)
  attestations: write    # persist the attestation
jobs:
  # The push-triggered lint / ascii-check runs on the tag do not block this
  # workflow, and a PowerShell Gallery version can never be re-published -
  # so the same two gates run here and the release waits for them.
  lint:
    uses: ./.github/workflows/lint.yml
  ascii-check:
    uses: ./.github/workflows/ascii-check.yml
  release:
    needs: [lint, ascii-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the previous tag, for the compare link in the notes
      - name: Extract release notes from CHANGELOG
        # Release notes are hand-written on purpose. `--generate-notes` lists
        # merged PRs, and this repo lands nearly everything as direct commits to
        # main, so it produced a body holding nothing but a compare link. This
        # step is deliberately a GATE, not a fallback: a tag whose version has no
        # CHANGELOG section fails the release instead of publishing empty notes.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 { f = 1; next }
            f && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md has no '## [$VER]' section - add one before tagging $GITHUB_REF_NAME."
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREV" "$GITHUB_REF_NAME" >> RELEASE_NOTES.md
          fi
      - name: Sync PSScriptInfo version to tag
        # The tag is the single source of truth for the version. The .VERSION
        # in the committed file is a placeholder; stamp the tag (minus the
        # leading v) into it here so provenance, checksums, and the PSGallery
        # package all describe the same version.
        run: sed -i "s/^\.VERSION .*/.VERSION ${GITHUB_REF_NAME#v}/" msi-mode-utility.ps1
      - name: Compute checksums
        run: sha256sum msi-mode-utility.ps1 > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'msi-mode-utility.ps1'
      - name: Publish to PowerShell Gallery
        # Before the GitHub release on purpose: the Gallery API key expires
        # (365 days at most) and this is the step that fails when it does. Failing
        # here leaves nothing published - rotate NUGET_API_KEY and re-run the job.
        # The other order left a release behind that the re-run then tripped over.
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: Publish-Script -Path ./msi-mode-utility.ps1 -NuGetApiKey $env:NUGET_API_KEY
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # --title: without it the release has no name and GitHub shows the
        # tagged commit's subject next to the tag instead.
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md msi-mode-utility.ps1 SHA256SUMS.txt
