name: release
on:
  workflow_dispatch:
permissions: {}
concurrency: release
jobs:
  release:
    permissions:
      contents: write        # create the release and upload assets
      id-token: write        # OIDC token for Sigstore signing (provenance)
      attestations: write    # persist the attestation
    uses: vadyaravadim/latency-toolbox-ci/.github/workflows/pipeline.yml@83ceb1e54c9b361b82db207bc5d43516a58b741b # v1.1.0
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
